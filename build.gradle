plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dynamicpill.module'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dynamicpill.module'
        minSdk 30
        targetSdk 34
        versionCode 30
        versionName '3.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // Debug keystore se sign: unsigned APK install/verify nahi hoti
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
